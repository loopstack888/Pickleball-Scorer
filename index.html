<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickleball Scorer</title>

<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }

  h1 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #333;
    margin-bottom: 16px;
  }

  /* Mode Tabs */
  .tabs {
    display: flex;
    background: #e0e0d8;
    border-radius: 12px;
    padding: 4px;
    width: 100%;
    max-width: 360px;
    margin-bottom: 14px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 9px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    color: #777;
    transition: all 0.2s;
    border: none;
    background: transparent;
  }
  .tab.active {
    background: #fff;
    color: #222;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }

  /* Serve Indicator */
  .serve-indicator {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
  }
  .serve-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .server-pip {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1rem;
    color: #aaa;
    transition: all 0.25s;
  }
  .server-pip.active {
    background: #2ecc71;
    color: #fff;
    box-shadow: 0 0 0 3px rgba(46,204,113,0.25);
  }

  /* Scoreboard */
  .scoreboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    max-width: 360px;
    margin-bottom: 20px;
  }
  .team-card {
    background: #fff;
    border-radius: 16px;
    padding: 16px 12px;
    text-align: center;
    border: 2px solid transparent;
    transition: border-color 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .team-card.serving {
    border-color: #2ecc71;
    box-shadow: 0 0 0 1px rgba(46,204,113,0.2);
  }
  .team-name-input {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #555;
    border: none;
    background: transparent;
    text-align: center;
    width: 100%;
    outline: none;
    cursor: text;
  }
  .team-name-input:focus {
    border-bottom: 1.5px solid #2ecc71;
  }
  .serve-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2ecc71;
    display: inline-block;
    margin-left: 6px;
    vertical-align: middle;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .team-card.serving .serve-dot { opacity: 1; }

  .score-display {
    font-size: 4.5rem;
    font-weight: 800;
    color: #222;
    line-height: 1.1;
    margin: 8px 0 4px;
    transition: color 0.3s;
  }
  .team-card.winner .score-display { color: #2ecc71; }

  .win-badge {
    display: none;
    font-size: 0.75rem;
    font-weight: 700;
    color: #2ecc71;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .team-card.winner .win-badge { display: block; }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 360px;
    margin-bottom: 12px;
  }
  .btn {
    flex: 1;
    padding: 18px 10px;
    border-radius: 14px;
    border: none;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 0.03em;
  }
  .btn:active { transform: scale(0.96); }
  .btn-point {
    background: #2ecc71;
    color: #fff;
    box-shadow: 0 4px 12px rgba(46,204,113,0.35);
  }
  .btn-fault {
    background: #ff6b6b;
    color: #fff;
    box-shadow: 0 4px 12px rgba(255,107,107,0.3);
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  /* Serving team label */
  .serving-label {
    font-size: 0.78rem;
    color: #888;
    text-align: center;
    margin-bottom: 14px;
    font-weight: 500;
  }
  .serving-label strong { color: #2ecc71; }

  /* Reset */
  .btn-reset {
    width: 100%;
    max-width: 360px;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid #ddd;
    background: #fff;
    color: #888;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-reset:hover { border-color: #bbb; color: #555; }

  /* Win overlay message */
  .win-message {
    display: none;
    background: #2ecc71;
    color: #fff;
    border-radius: 14px;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
    width: 100%;
    max-width: 360px;
    margin-bottom: 12px;
    letter-spacing: 0.03em;
  }
  .win-message.visible { display: block; }
</style>
</head>
<body>

<h1>Pickleball Scorer</h1>

<!-- Mode Tabs -->
<div class="tabs">
  <button class="tab" id="tab-singles" onclick="setMode('singles')">Singles</button>
  <button class="tab active" id="tab-doubles" onclick="setMode('doubles')">Doubles</button>
</div>

<!-- Serve Indicator (doubles only) -->
<div class="serve-indicator" id="serve-indicator">
  <span class="serve-label">Server</span>
  <div class="server-pip active" id="pip-1">1</div>
  <div class="server-pip" id="pip-2">2</div>
</div>

<!-- Scoreboard -->
<div class="scoreboard">
  <div class="team-card serving" id="card-a">
    <div>
      <input class="team-name-input" id="name-a" value="Team A" maxlength="12">
      <span class="serve-dot"></span>
    </div>
    <div class="score-display" id="score-a">0</div>
    <div class="win-badge">Winner! 🎉</div>
  </div>
  <div class="team-card" id="card-b">
    <div>
      <input class="team-name-input" id="name-b" value="Team B" maxlength="12">
      <span class="serve-dot"></span>
    </div>
    <div class="score-display" id="score-b">0</div>
    <div class="win-badge">Winner! 🎉</div>
  </div>
</div>

<!-- Win Message -->
<div class="win-message" id="win-message"></div>

<!-- Serving label -->
<div class="serving-label" id="serving-label"></div>

<!-- Controls -->
<div class="controls">
  <button class="btn btn-point" id="btn-point" onclick="handlePoint()">+ Point</button>
  <button class="btn btn-fault" id="btn-fault" onclick="handleFault()">Fault</button>
</div>

<!-- Reset -->
<button class="btn-reset" onclick="resetGame()">↺ Reset</button>

<script>
  // State
  let state = {};

  function initState() {
    state = {
      mode: 'doubles',
      scoreA: 0,
      scoreB: 0,
      // servingTeam: 'A' or 'B'
      servingTeam: 'A',
      // doubles: 1 or 2 (server number within team)
      serverNum: 1,
      // first serve of game flag (doubles)
      firstServeOfGame: true,
      gameOver: false,
    };
  }

  function setMode(mode) {
    state.mode = mode;
    document.getElementById('tab-singles').classList.toggle('active', mode === 'singles');
    document.getElementById('tab-doubles').classList.toggle('active', mode === 'doubles');
    resetGame();
  }

  function handlePoint() {
    if (state.gameOver) return;
    if (state.servingTeam === 'A') state.scoreA++;
    else state.scoreB++;
    // after scoring, server stays same, server number stays
    render();
  }

  function handleFault() {
    if (state.gameOver) return;

    if (state.mode === 'singles') {
      // serve switches to opponent
      state.servingTeam = state.servingTeam === 'A' ? 'B' : 'A';
    } else {
      // doubles logic
      if (state.firstServeOfGame) {
        // very first serve: only one server, immediately switch
        state.servingTeam = state.servingTeam === 'A' ? 'B' : 'A';
        state.serverNum = 1;
        state.firstServeOfGame = false;
      } else if (state.serverNum === 1) {
        // first fault: pass to server 2 on same team
        state.serverNum = 2;
      } else {
        // second fault: pass to opposing team, reset to server 1
        state.servingTeam = state.servingTeam === 'A' ? 'B' : 'A';
        state.serverNum = 1;
      }
    }
    render();
  }

  function resetGame() {
    initState();
    state.mode = document.getElementById('tab-doubles').classList.contains('active') ? 'doubles' : 'singles';
    render();
  }

  function render() {
    const { mode, scoreA, scoreB, servingTeam, serverNum, firstServeOfGame, gameOver } = state;

    // Check win
    const aWon = scoreA >= 11;
    const bWon = scoreB >= 11;
    state.gameOver = aWon || bWon;

    // Scores
    document.getElementById('score-a').textContent = scoreA;
    document.getElementById('score-b').textContent = scoreB;

    // Cards
    const cardA = document.getElementById('card-a');
    const cardB = document.getElementById('card-b');
    cardA.classList.toggle('serving', servingTeam === 'A' && !state.gameOver);
    cardB.classList.toggle('serving', servingTeam === 'B' && !state.gameOver);
    cardA.classList.toggle('winner', aWon);
    cardB.classList.toggle('winner', bWon);

    // Win message
    const winMsg = document.getElementById('win-message');
    if (aWon) {
      winMsg.textContent = `🎉 ${document.getElementById('name-a').value} wins!`;
      winMsg.classList.add('visible');
    } else if (bWon) {
      winMsg.textContent = `🎉 ${document.getElementById('name-b').value} wins!`;
      winMsg.classList.add('visible');
    } else {
      winMsg.classList.remove('visible');
    }

    // Serve indicator (doubles only)
    const indicator = document.getElementById('serve-indicator');
    indicator.style.display = mode === 'doubles' ? 'flex' : 'none';
    if (mode === 'doubles') {
      document.getElementById('pip-1').classList.toggle('active', serverNum === 1);
      document.getElementById('pip-2').classList.toggle('active', serverNum === 2);
    }

    // Serving label
    const servingLabel = document.getElementById('serving-label');
    if (!state.gameOver) {
      const teamName = servingTeam === 'A'
        ? document.getElementById('name-a').value
        : document.getElementById('name-b').value;
      servingLabel.innerHTML = `Serving: <strong>${teamName}</strong>`;
    } else {
      servingLabel.innerHTML = '';
    }

    // Disable buttons on game over
    document.getElementById('btn-point').disabled = state.gameOver;
    document.getElementById('btn-fault').disabled = state.gameOver;
  }

  // Init
  initState();
  render();

  // Re-render on name change
  document.getElementById('name-a').addEventListener('input', render);
  document.getElementById('name-b').addEventListener('input', render);
</script>
</body>
</html>
